<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Template Designer</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>

<div class="container">

    <h1>Template Designer</h1>

    <div class="panel">

        <h2>Template Version</h2>

		<div class="template-selection">

		    <!-- Template -->
		    <label>
		        Template
		        <select id="designerTemplate">
		            <option value="">
		                Select Template
		            </option>
		        </select>
		    </label>

		    <button id="newTemplate">
		        + New Template
		    </button>
			<br><br>
		    <!-- Version -->
		    <label>
		        Version
		        <select id="designerTemplateVersion" disabled>
		            <option value="">
		                Select Version
		            </option>
		        </select>
		    </label>

		    <button id="newVersion" disabled>
		        + New Version
		    </button>
			<br><br>
		    <!-- Version Status -->
		    <div id="versionStatus" style="display: none;">
		        Status:
		        <strong id="versionStatusText"></strong>

		        <button id="activateVersion"
		                style="display: none;">
		            Activate Version
		        </button>
		    </div>

		</div>


		<div id="designerMessage"></div>


		<!-- New Template Form -->
		<div id="newTemplateForm"
		     class="designer-form"
		     style="display: none;">

		    <h3>New Template</h3>

		    <label>
		        Template Name
		        <input
		            type="text"
		            id="newTemplateName"
		            placeholder="Employee Template">
		    </label>

		    <label>
		        Description
		        <textarea
		            id="newTemplateDescription"
		            placeholder="Template description"></textarea>
		    </label>
			<br><br>
		    <div>
		        <button id="saveTemplate">
		            Create Template
		        </button>

		        <button id="cancelTemplate">
		            Cancel
		        </button>
		    </div>

		</div>


		<!-- New Version Form -->
		<div id="newVersionForm"
		     class="designer-form"
		     style="display: none;">

		    <h3>New Template Version</h3>

		    <label>
		        Version
		        <input
		            type="text"
		            id="newVersionName"
		            placeholder="1.0">
		    </label>

		    <label>
		        Effective Date
		        <input
		            type="date"
		            id="newVersionEffectiveDate">
		    </label>

		    <label>
		        Published By
		        <input
		            type="text"
		            id="newVersionPublishedBy"
		            placeholder="Admin">
		    </label>
			<br><br>
		    <div>
		        <button id="saveVersion">
		            Create Version
		        </button>

		        <button id="cancelVersion">
		            Cancel
		        </button>
		    </div>

		</div>


    <div class="panel">

        <div class="designer-header">

            <h2>Target Fields</h2>

			<button id="addTargetField">
			    + Add Field
			</button>

        </div>

		<div id="targetFieldForm" style="display:none;">

		    <h3>Add Target Field</h3>

		    <div class="field-form-grid">

		        <div>
		            <label for="fieldName">Field Name</label>
		            <input type="text" id="fieldName">
		        </div>

		        <div>
		            <label for="fieldKey">Key</label>
		            <input type="text" id="fieldKey">
		        </div>

		        <div>
		            <label for="fieldDataType">Data Type</label>

		            <select id="fieldDataType">
		                <option value="STRING">STRING</option>
		                <option value="INTEGER">INTEGER</option>
		                <option value="DECIMAL">DECIMAL</option>
		                <option value="DATE">DATE</option>
		                <option value="BOOLEAN">BOOLEAN</option>
		                <option value="EMAIL">EMAIL</option>
		            </select>
		        </div>


		        <div>
		            <label for="fieldMandatory">Required</label>
		            <input type="checkbox" id="fieldMandatory">
		        </div>

		        <div>
		            <label for="fieldDefaultValue">Default Value</label>
		            <input type="text" id="fieldDefaultValue">
		        </div>

		    </div>

		    <div>
		        <label for="fieldDescription">Description</label>

		        <textarea
		            id="fieldDescription"
		            rows="3"
		        ></textarea>
		    </div>

		    <div class="field-form-actions">

		        <button id="saveTargetField">
		            Save Field
		        </button>

		        <button id="cancelTargetField">
		            Cancel
		        </button>

		    </div>

		</div>
		
        <table id="targetFieldsTable">

            <thead>
            <tr>
                <th>#</th>
                <th>Field Name</th>
                <th>Key</th>
                <th>Type</th>
                <th>Required</th>
                <th>Default Value</th>
                <th>Description</th>
                <th>Action</th>
            </tr>
            </thead>

            <tbody></tbody>

        </table>

    </div>

	<div id="validationRulesPanel"
	     class="panel"
	     style="display: none;">

	    <div class="designer-header">
	        <h2>
	            Validation Rules —
	            <span id="validationRulesFieldName"></span>
	        </h2>
			<button id="addValidationRule">
			    + Add Rule
			</button>
	    </div>

		<div id="validationRuleForm"
		     class="designer-form"
		     style="display: none;">

		    <h3>Add Validation Rule</h3>

		    <label>
		        Rule Type
		        <select id="validationRuleType">
		            <option value="">Select Rule Type</option>
		            <option value="REQUIRED">REQUIRED</option>
		            <option value="REGEX">REGEX</option>
		            <option value="MIN_LENGTH">MIN_LENGTH</option>
		            <option value="MAX_LENGTH">MAX_LENGTH</option>
		            <option value="MIN_VALUE">MIN_VALUE</option>
		            <option value="MAX_VALUE">MAX_VALUE</option>
		        </select>
		    </label>

		    <label>
		        Rule Value
		        <input
		            type="text"
		            id="validationRuleValue"
		            placeholder="Rule value">
		    </label>

		    <label>
		        Error Message
		        <input
		            type="text"
		            id="validationRuleErrorMessage"
		            placeholder="Validation error message">
		    </label>

		    <label>
		        Sequence
		        <input
		            type="number"
		            id="validationRuleSequence"
		            min="1">
		    </label>

			<label class="checkbox-label">
			    <input
			        type="checkbox"
			        id="validationRuleActive"
			        checked>
				<span>Active</span> 
			</label>
			<br>
		    <div>
		        <button id="saveValidationRule">
		            Save Rule
		        </button>

		        <button id="cancelValidationRule">
		            Cancel
		        </button>
		    </div>

		</div>
		
	    <table id="validationRulesTable">
	        <thead>
	            <tr>
	                <th>#</th>
	                <th>Rule Type</th>
	                <th>Rule Value</th>
	                <th>Error Message</th>
	                <th>Active</th>
	                <th>Action</th>
	            </tr>
	        </thead>

	        <tbody></tbody>
	    </table>

	</div>
	
    <a href="index.html">
        Back to Mapping
    </a>

</div>

<script src="template-designer.js"></script>

</body>

</html>
